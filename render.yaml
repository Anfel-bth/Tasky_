databases:
  - name: tasky-db
    databaseName: tasky
    user: tasky
    plan: free

services:
  - type: web
    name: tasky-api
    runtime: node
    plan: free
    rootDir: task-manager-backend
    buildCommand: npm ci
    # If you add a script that creates the tables, use:
    # startCommand: npm run migrate && npm start
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tasky-db
          property: connectionString
      - key: DB_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      # Must match the frontend origin exactly: https, no trailing slash, no path
      - key: CORS_ORIGIN
        value: https://tasky-frontend-vvxi.onrender.com
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: tasky-frontend
    runtime: static
    rootDir: task-manager-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Must end with /api
      - key: VITE_API_BASE
        value: https://tasky-api-vd2h.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html